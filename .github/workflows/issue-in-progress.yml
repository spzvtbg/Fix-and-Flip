
name: Move Issue to In Progress

on:
  create:

permissions:
  contents: read
  issues: read

jobs:
  move-issue:
    if: github.event.ref_type == 'branch'
    runs-on: ubuntu-latest

    steps:
      - name: Extract issue number
        id: issue
        env:
          BRANCH_NAME: ${{ github.event.ref }}
        run: |
          if [[ "$BRANCH_NAME" =~ ^(feature|bugfix|docs|chore|test|hotfix)/([0-9]+)- ]]; then
            echo "number=${BASH_REMATCH[2]}" >> "$GITHUB_OUTPUT"
            echo "Detected issue #${BASH_REMATCH[2]}"
          else
            echo "No issue number found in branch name."
          fi

      - name: Move issue to In Progress
        if: steps.issue.outputs.number != ''
        env:
          GH_TOKEN: ${{ secrets.GH_PROJECT_TOKEN }}
          ISSUE_NUMBER: ${{ steps.issue.outputs.number }}
        shell: bash
        run: |
          set -euo pipefail

          OWNER="spzvtbg"
          REPO="Fix-and-Flip"
          PROJECT_NUMBER=20

          echo "Looking up issue #$ISSUE_NUMBER..."

          QUERY='
          query(
            $owner: String!,
            $projectNumber: Int!,
            $repo: String!,
            $issueNumber: Int!
          ) {
            repository(owner: $owner, name: $repo) {
              issue(number: $issueNumber) {
                id
              }
            }
            user(login: $owner) {
              projectV2(number: $projectNumber) {
                id
                fields(first: 50) {
                  nodes {
                    ... on ProjectV2SingleSelectField {
                      id
                      name
                      options {
                        id
                        name
                      }
                    }
                  }
                }
                items(first: 100) {
                  nodes {
                    id
                    content {
                      ... on Issue {
                        id
                        number
                      }
                    }
                  }
                }
              }
            }
          }'

          DATA=$(gh api graphql \
            -f query="$QUERY" \
            -F owner="$OWNER" \
            -F projectNumber="$PROJECT_NUMBER" \
            -F repo="$REPO" \
            -F issueNumber="$ISSUE_NUMBER")

          ISSUE_ID=$(jq -r '.data.repository.issue.id // empty' <<< "$DATA")
          PROJECT_ID=$(jq -r '.data.user.projectV2.id // empty' <<< "$DATA")

          STATUS_FIELD_ID=$(jq -r '
            .data.user.projectV2.fields.nodes[]
            | select(.name == "Status")
            | .id
          ' <<< "$DATA")

          STATUS_OPTION_ID=$(jq -r '
            .data.user.projectV2.fields.nodes[]
            | select(.name == "Status")
            | .options[]
            | select(.name == "In Progress")
            | .id
          ' <<< "$DATA")

          if [[ -z "$ISSUE_ID" ]]; then
            echo "ERROR: Issue #$ISSUE_NUMBER was not found in $OWNER/$REPO."
            exit 1
          fi

          if [[ -z "$PROJECT_ID" ]]; then
            echo "ERROR: User-owned Project #$PROJECT_NUMBER was not found."
            exit 1
          fi

          if [[ -z "$STATUS_FIELD_ID" || -z "$STATUS_OPTION_ID" ]]; then
            echo "ERROR: Status field or In Progress option was not found."
            exit 1
          fi

          echo "Issue and project found."

          ITEM_ID=$(jq -r --arg issueId "$ISSUE_ID" '
            .data.user.projectV2.items.nodes[]
            | select(.content.id == $issueId)
            | .id
          ' <<< "$DATA")

          if [[ -z "$ITEM_ID" ]]; then
            echo "Adding issue to project..."

            ADD_ITEM='
            mutation($projectId: ID!, $contentId: ID!) {
              addProjectV2ItemById(input: {
                projectId: $projectId,
                contentId: $contentId
              }) {
                item {
                  id
                }
              }
            }'

            ITEM_ID=$(gh api graphql \
              -f query="$ADD_ITEM" \
              -F projectId="$PROJECT_ID" \
              -F contentId="$ISSUE_ID" \
              --jq '.data.addProjectV2ItemById.item.id')
          fi

          if [[ -z "$ITEM_ID" ]]; then
            echo "ERROR: Could not find or add the issue to the project."
            exit 1
          fi

          echo "Updating project status..."

          UPDATE_STATUS='
          mutation(
            $projectId: ID!,
            $itemId: ID!,
            $fieldId: ID!,
            $optionId: String!
          ) {
            updateProjectV2ItemFieldValue(input: {
              projectId: $projectId,
              itemId: $itemId,
              fieldId: $fieldId,
              value: {
                singleSelectOptionId: $optionId
              }
            }) {
              projectV2Item {
                id
              }
            }
          }'

          gh api graphql \
            -f query="$UPDATE_STATUS" \
            -F projectId="$PROJECT_ID" \
            -F itemId="$ITEM_ID" \
            -F fieldId="$STATUS_FIELD_ID" \
            -F optionId="$STATUS_OPTION_ID"

          echo "SUCCESS: Issue #$ISSUE_NUMBER moved to In Progress."
