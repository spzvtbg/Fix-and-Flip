name: Move Issue to In Progress

on:
  create: 

permissions:
  contents: read
  issues: read

jobs:
  move-issue:
    runs-on: ubuntu-latest

    steps:
    
      - name: Get branch name
        id: issue
        env: 
          BRANCH_NAME: ${{ github.event.ref }}
        run: | 
          echo "branch name: $BRANCH_NAME"    
          if [[ "$BRANCH_NAME" =~ ^(docs|test)/([0-9]+) ]]; then
              ISSUE_NUMBER="${BASH_REMATCH[2]}"
              echo "Issue number: $ISSUE_NUMBER"
              echo "issue_number=$ISSUE_NUMBER" >> "$GITHUB_OUTPUT"
          else
              echo "No action needed"
              exit 0
          fi 
          
      - name: Retrive issue information
        id: project
        env:
          ISSUE_NUMBER: ${{ steps.issue.outputs.issue_number }}
          GH_TOKEN: ${{ secrets.GH_PROJECT_TOKEN }} # auto recognized from the CLI
        run: |
          ISSUE_ID=$(gh issue view "$ISSUE_NUMBER" \
          --repo spzvtbg/Fix-and-Flip \
          --json id \
          --jq '.id')
          if [[ -z "$ISSUE_ID" ]]; then
              echo "No issue found to process."
              exit 0
          else
            echo "Successfully retrieved issue ID: $ISSUE_ID"
          fi

          ITEM_QUERY='
          query {
            node(id: "'"$ISSUE_ID"'") {
              ... on Issue {
                projectItems(first: 20) {
                  nodes {
                    id
                    project {
                      number
                    }
                  }
                }
              }
            }
          }'

          PROJECT_ID="20"
          PROJECT_ITEM_ID=$(gh api graphql \
            -f query="$ITEM_QUERY" \
            --jq '.data.node.projectItems.nodes[]
                | select(.project.number == 20)
                | .id')
          
          if [[ -z "$PROJECT_ITEM_ID" ]]; then
            echo "Project item not found. No action needed."
            exit 0
          else
            echo "Project Item ID: $PROJECT_ITEM_ID"
          fi

          FIELDS_QUERY='
          query {
            node(id: "'"$PROJECT_ID"'") {
              ... on ProjectV2 {
                fields(first: 20) {
                  nodes {
                    ... on ProjectV2SingleSelectField {
                      id
                      name
                      options {
                        id
                        name
                      }
                    }
                  }
                }
              }
            }
          }'
          
          FIELDS_RESULT=$(gh api graphql -f query="$FIELDS_QUERY")
          STATUS_FIELD_ID=$(echo "$FIELDS_RESULT" | jq -r '
              .data.node.fields.nodes[]
              | select(.name == "Status")
              | .id
          ')
          STATUS_OPTION_ID=$(echo "$FIELDS_RESULT" | jq -r '
              .data.node.fields.nodes[]
              | select(.id == "'"$STATUS_FIELD_ID"'")
              | .options[]
              | select(.name == "In Progress")
              | .id
          ')

          # Exports as variables to the output
          echo "project_id=$PROJECT_ID" >> "$GITHUB_OUTPUT"
          echo "project_item_id=$PROJECT_ITEM_ID" >> "$GITHUB_OUTPUT"
          echo "status_field_id=$STATUS_FIELD_ID" >> "$GITHUB_OUTPUT"
          echo "status_option_id=$STATUS_OPTION_ID" >> "$GITHUB_OUTPUT"

      - name: Update issue status
        env:
          GH_TOKEN: ${{ secrets.GH_PROJECT_TOKEN }}
          PROJECT_ID: ${{ steps.project.outputs.project_id }}
          PROJECT_ITEM_ID: ${{ steps.project.outputs.project_item_id }}
          STATUS_FIELD_ID: ${{ steps.project.outputs.status_field_id }}
          STATUS_OPTION_ID: ${{ steps.project.outputs.status_option_id }}
        run: |
          UPDATE_STATUS_MUTATION_QUERY='
          mutation($projectId: ID!, $itemId: ID!, $fieldId: ID!, $optionId: String!) {
            updateProjectV2ItemFieldValue(
              input: {
                projectId: $projectId
                itemId: $itemId
                fieldId: $fieldId
                value: {
                  singleSelectOptionId: $optionId
                }
              }
            ) {
              projectV2Item {
                id
              }
            }
          }'
          
          echo "Moving issue to In Progress..."
          gh api graphql \
          -f query="$UPDATE_STATUS_MUTATION_QUERY" \
          -f projectId="$PROJECT_ID" \
          -f itemId="$PROJECT_ITEM_ID" \
          -f fieldId="$STATUS_FIELD_ID" \
          -f optionId="$STATUS_OPTION_ID"
          echo "Issue moved to In Progress..."












          
