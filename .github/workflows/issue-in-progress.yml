name: Move Issue to In Progress

on:
  create: 

permissions:
  contents: read
  issues: read

jobs:
  move-issue:
    runs-on: ubuntu-latest

    steps:
    
      - name: Get branch name
        env: 
          BRANCH_NAME: ${{ github.event.ref }}
        run: | 
          echo "branch name: $BRANCH_NAME"    
          if [[ "$BRANCH_NAME" =~ ^(docs|test)/([0-9]+) ]]; then
              ISSUE_NUMBER="${BASH_REMATCH[2]}"
              echo "Issue number: $ISSUE_NUMBER"
              echo "issue_number=$ISSUE_NUMBER" >> "$GITHUB_OUTPUT"
          else
              echo "No action needed"
              exit 0
          fi 
          
      - name: Retrive issue information
        env:
          ISSUE_NUMBER: ${{ steps.issue.outputs.issue_number }}
          GH_TOKEN: ${{ secrets.GH_PROJECT_TOKEN }} # auto recognized from the CLI
        run: |
          ISSUE_ID=$(gh issue view "$ISSUE_NUMBER" \
          --repo spzvtbg/Fix-and-Flip \
          --json id \
          --jq '.id')
          if [[ -z "$ISSUE_ID" ]]; then
              echo "No issue found to process."
              exit 0
          else
            echo "Successfully retrieved issue ID: $ISSUE_ID"
          fi












          
