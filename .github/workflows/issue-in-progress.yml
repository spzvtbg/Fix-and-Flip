name: Move Issue to In Progress

on:
  create:

permissions:
  contents: read
  issues: read

jobs:
  move-issue:
    if: github.event.ref_type == 'branch'
    runs-on: ubuntu-latest

    steps:
      - name: Extract issue number
        id: issue
        env:
          BRANCH_NAME: ${{ github.event.ref }}
        run: |
          if [[ "$BRANCH_NAME" =~ ^(feature|bugfix|docs|chore|test|hotfix)/([0-9]+)- ]]; then
            echo "number=${BASH_REMATCH[2]}" >> "$GITHUB_OUTPUT"
          else
            echo "No issue number found in branch name."
          fi

      - name: Move issue to In Progress
        if: steps.issue.outputs.number != ''
        env:
          GH_TOKEN: ${{ secrets.GH_PROJECT_TOKEN }}
          ISSUE_NUMBER: ${{ steps.issue.outputs.number }}
        run: |
          OWNER="spzvtbg"
          REPO="Fix-and-Flip"
          PROJECT_NUMBER=20

          QUERY='
          query($owner: String!, $projectNumber: Int!, $repo: String!, $issueNumber: Int!) {
            repository(owner: $owner, name: $repo) {
              issue(number: $issueNumber) {
                id
              }
            }
            user(login: $owner) {
              projectV2(number: $projectNumber) {
                id
                fields(first: 50) {
                  nodes {
                    ... on ProjectV2SingleSelectField {
                      id
                      name
                      options {
                        id
                        name
                      }
                    }
                  }
                }
                items(first: 100) {
                  nodes {
                    id
                    content {
                      ... on Issue {
                        id
                        number
                      }
                    }
                  }
                }
              }
            }
          }'

          DATA=$(gh api graphql \
            -f query="$QUERY" \
            -F owner="$OWNER" \
            -F projectNumber="$PROJECT_NUMBER" \
            -F repo="$REPO" \
            -F issueNumber="$ISSUE_NUMBER")

          ISSUE_ID=$(echo "$DATA" | jq -r '.data.repository.issue.id // empty')
          PROJECT_ID=$(echo "$DATA" | jq -r '.data.user.projectV2.id // empty')
          STATUS_FIELD_ID=$(echo "$DATA" | jq -r '.data.user.projectV2.fields.nodes[] | select(.name == "Status") | .id')
          STATUS_OPTION_ID=$(echo "$DATA" | jq -r '.data.user.projectV2.fields.nodes[] | select(.name == "Status") | .options[] | select(.name == "In Progress") | .id')

          if [[ -z "$ISSUE_ID" || -z "$PROJECT_ID" || -z "$STATUS_FIELD_ID" || -z "$STATUS_OPTION_ID" ]]; then
            echo "Could not find the issue, project, Status field, or In Progress option."
            exit 1
          fi

          ITEM_ID=$(echo "$DATA" | jq -r --arg issueId "$ISSUE_ID" \
            '.data.user.projectV2.items.nodes[] | select(.content.id == $issueId) | .id')

          if [[ -z "$ITEM_ID" ]]; then
            ADD_ITEM='
            mutation($projectId: ID!, $contentId: ID!) {
              addProjectV2ItemById(input: {
                projectId: $projectId,
                contentId: $contentId
              }) {
                item {
                  id
                }
              }
            }'

            ITEM_ID=$(gh api graphql \
              -f query="$ADD_ITEM" \
              -f projectId="$PROJECT_ID" \
              -f contentId="$ISSUE_ID" \
              --jq '.data.addProjectV2ItemById.item.id')
          fi

          UPDATE_STATUS='
          mutation($projectId: ID!, $itemId: ID!, $fieldId: ID!, $optionId: String!) {
            updateProjectV2ItemFieldValue(input: {
              projectId: $projectId,
              itemId: $itemId,
              fieldId: $fieldId,
              value: {
                singleSelectOptionId: $optionId
              }
            }) {
              projectV2Item {
                id
              }
            }
          }'

          gh api graphql \
            -f query="$UPDATE_STATUS" \
            -f projectId="$PROJECT_ID" \
            -f itemId="$ITEM_ID" \
            -f fieldId="$STATUS_FIELD_ID" \
            -f optionId="$STATUS_OPTION_ID"

          echo "Issue #$ISSUE_NUMBER moved to In Progress."
